<!doctype html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="common.css">
<style>
.title { left: 510px; transform: translateX(-50%); white-space: nowrap; font-weight: 900; text-align: center; }
.title span { display: inline-block; }
#t1 { top: 318px; font-size: 104px; text-shadow: 0 8px 0 #0a1a4d; }
#t2 { top: 438px; font-size: 150px; color: #FFD23F; text-shadow: 0 10px 0 #b8441a; }
#sub { left: 510px; top: 628px; transform: translateX(-50%); font: 600 40px 'Unb'; white-space: nowrap; opacity: .95; }
#card { left: 510px; top: 1014px; width: 648px; height: 628px; margin: -314px 0 0 -324px; background: #fff; border-radius: 38px;
  padding: 14px; box-shadow: 0 30px 70px rgba(0,0,0,.5); }
#card .win { width: 620px; height: 600px; border-radius: 26px; overflow: hidden; position: relative; }
#card img { width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 60%; }
#sweep { position: absolute; top: -20%; width: 180px; height: 140%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); transform: rotate(18deg); }
#qbub { left: 790px; top: 690px; width: 132px; height: 132px; border-radius: 50%; background: #FFD23F; color: #0d2160;
  font: 900 92px/132px 'Unb'; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
#price { left: 510px; top: 1352px; transform: translateX(-50%); display: flex; align-items: center; gap: 10px; padding: 18px 26px;
  border-radius: 34px; background: rgba(5,14,44,.62); border: 3px solid rgba(255,210,63,.35); }
.slot { width: 104px; height: 150px; border-radius: 18px; background: #fff; overflow: hidden; position: relative; }
.strip { position: absolute; left: 0; top: 0; width: 100%; }
.strip div { height: 150px; font: 900 100px/150px 'Unb'; color: #0d2160; text-align: center; }
.strip div.q { color: #FF7A1A; }
.gap { width: 18px; }
.rub { font: 900 100px/150px 'Unb'; color: #fff; margin-left: 12px; }
.st { left: 510px; top: 1160px; opacity: 0; }
#st1 { background: #FFD23F; color: #0d2160; font-size: 52px; }
#st2 { background: #fff; color: #0d2160; font-size: 38px; }
#st3 { background: #FF7A1A; color: #fff; font-size: 42px; }
</style></head><body>
<div id="bg"></div><canvas id="snow"></canvas>
<div class="abs badge" id="badge">@mvtatv · <b>доставка по всей России</b> 🚚</div>
<div class="abs title" id="t1"></div>
<div class="abs title" id="t2"></div>
<div class="abs" id="sub">детского электробагги</div>
<div class="abs" id="card"><div class="win"><img src="src/buggy.jpg"><div id="sweep"></div></div></div>
<div class="abs" id="qbub">?</div>
<div class="abs" id="price"></div>
<div class="abs sticker st" id="st1">Пиши свой вариант<br>в комментариях 👇</div>
<div class="abs sticker st" id="st2">📌 Правильный ответ —<br>в закреплённом комментарии</div>
<div class="abs sticker st" id="st3">🎁 Подарок к Новому году<br>Заказ — в Direct 📩</div>
<script src="lib.js"></script>
<script>
const $ = id => document.getElementById(id);
const snow = makeSnow($('snow'));
const letters = (el, txt) => [...txt].map(ch => { const s = document.createElement('span'); s.textContent = ch; el.appendChild(s); return s; });
const L1 = letters($('t1'), 'УГАДАЙ'), L2 = letters($('t2'), 'ЦЕНУ');
// price reels: 2 + 3 slots, each ends on "?"
const T0 = 0.9, STOPS = [3.9, 4.3, 4.7, 5.1, 5.5], R = rng(42), slots = [];
const price = $('price');
STOPS.forEach((stop, i) => {
  if (i === 2) { const g = document.createElement('div'); g.className = 'gap'; price.appendChild(g); }
  const slot = document.createElement('div'); slot.className = 'slot';
  const strip = document.createElement('div'); strip.className = 'strip';
  const n = 16 + 3 * i;
  for (let k = 0; k < n + 2; k++) { const d = document.createElement('div');
    if (k === n) { d.textContent = '?'; d.className = 'q'; } else d.textContent = Math.floor(R() * 10); strip.appendChild(d); }
  slot.appendChild(strip); price.appendChild(slot); slots.push({ strip, n, stop });
});
const rub = document.createElement('div'); rub.className = 'rub'; rub.textContent = '₽'; price.appendChild(rub);
const pos = (s, t) => { const u = seg(t, T0, s.stop); let p = s.n * eOut(u);
  if (t > s.stop) p += 0.16 * Math.sin((t - s.stop) * 26) * Math.exp(-(t - s.stop) * 9); return p; };
// sound events (read by the renderer)
const SFX = [{ t: 0.0, k: 'whoosh', g: 0.5 }, { t: 0.08, k: 'pop', g: 0.5 }, { t: 0.36, k: 'pop', g: 0.8 }, { t: 0.48, k: 'whoosh', g: 0.7 }];
{ const ticks = []; for (const s of slots) { let last = 0; for (let t = T0; t <= s.stop; t += 0.004) { const f = Math.floor(pos(s, t)); if (f > last) { ticks.push(t); last = f; } } }
  ticks.sort((a, b) => a - b); let prev = -1; for (const t of ticks) if (t - prev > 0.055) { SFX.push({ t, k: 'tick', g: 0.45 }); prev = t; } }
STOPS.forEach(t => SFX.push({ t, k: 'thunk', g: 0.9 }));
SFX.push({ t: 5.6, k: 'ding', g: 0.7 }, { t: 5.85, k: 'pop', g: 0.9 }, { t: 7.95, k: 'swish', g: 0.6 },
  { t: 8.05, k: 'pop', g: 0.9 }, { t: 11.45, k: 'swish', g: 0.6 }, { t: 11.55, k: 'pop', g: 0.9 }, { t: 11.6, k: 'chime', g: 0.6 });
window.SFX = SFX;
window.seek = t => {
  snow(t);
  const b = eOut(seg(t, 0, 0.35)); $('badge').style.opacity = b; $('badge').style.transform = `translateX(-50%) translateY(${(1 - b) * -40}px)`;
  L1.forEach((s, i) => { const u = eBack(seg(t, 0.06 + 0.045 * i, 0.36 + 0.045 * i), 2.4); s.style.transform = `scale(${u})`; });
  L2.forEach((s, i) => { const u = eBack(seg(t, 0.34 + 0.06 * i, 0.66 + 0.06 * i), 2.6); s.style.transform = `scale(${u}) rotate(${(1 - u) * -20}deg)`; });
  const pulse = 1 + 0.035 * Math.sin(t * 6.5) * (t > 0.8);
  $('t2').style.transform = `translateX(-50%) scale(${pulse})`;
  const sb = eOut(seg(t, 0.55, 0.9)); $('sub').style.opacity = sb; $('sub').style.transform = `translateX(-50%) translateY(${(1 - sb) * 30}px)`;
  const c = eBack(seg(t, 0.45, 1.1), 1.3);
  $('card').style.transform = `translateY(${(1 - c) * 900}px) rotate(${lerp(10, -2.5, c) + Math.sin(t * 1.3) * 0.6}deg)`;
  $('card').querySelector('img').style.transform = `scale(${1.04 + 0.08 * t / 14.4})`;
  $('sweep').style.left = `${lerp(-300, 800, seg(t, 1.15, 1.9))}px`;
  const q = eBack(seg(t, 1.0, 1.35), 2.5); $('qbub').style.transform = `scale(${q}) rotate(${12 + Math.sin(t * 3.2) * 8}deg)`;
  const pr = eBack(seg(t, 0.7, 1.05), 1.6); price.style.transform = `translateX(-50%) scale(${pr})`;
  slots.forEach(s => { s.strip.style.transform = `translateY(${-pos(s, t) * 150}px)`; });
  const glow = t > 5.5 ? 0.5 + 0.5 * Math.sin((t - 5.5) * 5) : 0;
  price.style.borderColor = `rgba(255,210,63,${0.35 + 0.65 * glow})`; price.style.boxShadow = `0 0 ${50 * glow}px rgba(255,210,63,${0.6 * glow})`;
  popSticker($('st1'), t, 5.85, 7.95, -3); popSticker($('st2'), t, 8.05, 11.45, 2); popSticker($('st3'), t, 11.55, 99, -2);
};
window.seek(0);
</script></body></html>
