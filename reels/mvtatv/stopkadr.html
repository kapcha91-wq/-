<!doctype html><html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="common.css">
<style>
.title { left: 510px; transform: translateX(-50%); white-space: nowrap; font-weight: 900; text-align: center; }
#t1 { top: 312px; font-size: 100px; text-shadow: 0 8px 0 #0a1a4d; }
#t2 { top: 426px; font-size: 118px; color: #FFD23F; text-shadow: 0 10px 0 #b8441a; }
#sub { left: 510px; top: 582px; transform: translateX(-50%); font: 600 36px/1.3 'Unb', 'Noto Color Emoji'; text-align: center; white-space: nowrap; }
#card { left: 510px; top: 1038px; width: 884px; height: 669px; margin: -334px 0 0 -442px; background: #fff; border-radius: 40px; padding: 12px;
  box-shadow: 0 30px 70px rgba(0,0,0,.5); }
#card .win { width: 860px; height: 645px; border-radius: 30px; overflow: hidden; position: relative; background: #000; }
#card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; }
#num { left: 92px; top: 676px; width: 150px; height: 150px; border-radius: 50%; background: #FFD23F; color: #0d2160;
  font: 900 76px/150px 'Unb'; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.45); border: 6px solid #fff; }
#code { left: 900px; top: 1310px; transform: translateX(-100%); padding: 12px 26px; border-radius: 22px; background: rgba(8,19,51,.82);
  font: 800 34px 'Unb'; color: #fff; white-space: nowrap; }
#pause { left: 510px; top: 1440px; transform: translate(-50%,-50%); padding: 18px 40px; border-radius: 40px; background: #ff3b3b;
  font: 900 40px 'Unb', 'Noto Color Emoji'; white-space: nowrap; box-shadow: 0 10px 30px rgba(255,59,59,.45); display: flex; align-items: center; }
#pause i { display: inline-block; width: 12px; height: 38px; background: #fff; border-radius: 3px; margin-right: 8px; }
#pause i:nth-child(2) { margin-right: 22px; }
#dim { position: absolute; inset: 0; z-index: 2; background: rgba(8,19,51,.55); opacity: 0; }
.st { left: 510px; top: 1040px; opacity: 0; }
#st1 { background: #FFD23F; color: #0d2160; font-size: 58px; }
</style></head><body>
<div id="bg"></div><canvas id="snow"></canvas>
<div class="abs badge" id="badge">@mvtatv · <b>доставка по всей России</b> 🚚</div>
<div class="abs title" id="t1">ОСТАНОВИ</div>
<div class="abs title" id="t2">ВИДЕО ✋</div>
<div class="abs" id="sub">на чём остановишь —<br>то ребёнок найдёт под ёлкой 🎄</div>
<div class="abs" id="card"><div class="win" id="win"><div id="dim"></div></div></div>
<div class="abs" id="num">1</div>
<div class="abs" id="code"></div>
<div class="abs" id="pause"><i></i><i></i>ЖМИ НА ПАУЗУ</div>
<div class="abs sticker st" id="st1">Что выпало?<br>Пиши номер 👇</div>
<script src="lib.js"></script><script src="products.js"></script>
<script>
const $ = id => document.getElementById(id);
const snow = makeSnow($('snow'), 95, 11);
const ORDER = ['G63', 'FT908', '6666', '009', '5688', '800', 'T08', '9166', 'L6', 'BUGGY'];
const imgs = ORDER.map(k => { const i = document.createElement('img'); i.src = PRODUCTS[k].img; $('win').insertBefore(i, $('dim')); return i; });
const T0 = 0.75, STEP = 0.18, END = 8.3, DUR = 10.2, R = rng(5);
// each round shows all 10 in a new shuffled order, never the same photo twice in a row
const seq = []; let last = -1;
while (seq.length < 80) { const p = [...Array(10).keys()]; for (let i = 9; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; }
  if (p[0] === last) [p[0], p[1]] = [p[1], p[0]]; seq.push(...p); last = p[9]; }
window.seek = t => {
  snow(t);
  const b = eOut(seg(t, 0, 0.3)); $('badge').style.opacity = b;
  const a1 = eBack(seg(t, 0.0, 0.35), 2.2), a2 = eBack(seg(t, 0.15, 0.5), 2.6);
  $('t1').style.transform = `translateX(-50%) scale(${a1})`;
  $('t2').style.transform = `translateX(-50%) scale(${a2 * (1 + 0.04 * Math.sin(t * 7) * (t > 0.6))}) rotate(${-2 + Math.sin(t * 3) * 1.2}deg)`;
  const s = eOut(seg(t, 0.35, 0.7)); $('sub').style.opacity = s; $('sub').style.transform = `translateX(-50%) translateY(${(1 - s) * 30}px)`;
  const c = eBack(seg(t, 0.3, 0.8), 1.3); $('card').style.transform = `translateY(${(1 - c) * 900}px)`;
  const tt = Math.min(t, END - 0.001), k = Math.max(0, Math.floor((tt - T0) / STEP)), idx = seq[k];
  const since = tt - (T0 + k * STEP), punch = t < END ? 1 + 0.035 * Math.exp(-Math.max(0, since) * 30) : 1;
  imgs.forEach((im, i) => { im.style.opacity = i === idx ? 1 : 0; im.style.transform = `scale(${punch})`; });
  $('num').textContent = idx + 1; $('code').textContent = PRODUCTS[ORDER[idx]].label;
  const nb = eBack(seg(t, 0.6, 0.9), 2.4); $('num').style.transform = `scale(${nb * punch}) rotate(${-8 + Math.sin(t * 4) * 4}deg)`;
  $('code').style.opacity = seg(t, 0.75, 0.9);
  const pz = eBack(seg(t, 0.8, 1.1), 2.2), out = eIn(seg(t, END, END + 0.25));
  $('pause').style.transform = `translate(-50%,-50%) scale(${pz * (1 + 0.06 * Math.sin(t * 9)) * (1 - out)})`;
  $('dim').style.opacity = 0.9 * eOut(seg(t, END, END + 0.3));
  popSticker($('st1'), t, END + 0.1, 99, -3);
};
window.DUR = DUR; window.seek(0);
</script></body></html>
