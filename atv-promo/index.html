<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #08080a;
        --ink: #f5f3ef;
        --accent: #ff6a13;
        --red: #e01e2b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13"
      data-width="1080"
      data-height="1920"
    >
      <div id="plate" data-composition-id="plate" data-composition-src="compositions/plate.html"
        data-start="0" data-duration="13" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="2.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="wheel" data-composition-id="wheel" data-composition-src="compositions/wheel.html"
        data-start="2.4" data-duration="2.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="winch" data-composition-id="winch" data-composition-src="compositions/winch.html"
        data-start="4.6" data-duration="2.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 4"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html"
        data-start="6.8" data-duration="2.8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="9.6" data-duration="3.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 6"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
