<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #08080a;
        --ink: #f5f3ef;
        --accent: #ff6a13;
        --red: #e01e2b;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root { width: 100%; height: 100%; position: relative; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="13"
      data-width="1080"
      data-height="1920"
    >
      <div id="plate" data-composition-id="plate" data-composition-src="compositions/plate.html"
        data-start="0" data-duration="13" data-track-index="0" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 1"></div>

      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="2.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="wheel" data-composition-id="wheel" data-composition-src="compositions/wheel.html"
        data-start="2.4" data-duration="2.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 3"></div>
      <div id="winch" data-composition-id="winch" data-composition-src="compositions/winch.html"
        data-start="4.6" data-duration="2.2" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 4"></div>
      <div id="reveal" data-composition-id="reveal" data-composition-src="compositions/reveal.html"
        data-start="6.8" data-duration="2.8" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 5"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html"
        data-start="9.6" data-duration="3.4" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 6"></div>
      <audio id="music" class="clip" src="assets/audio/music.mp3" data-start="0" data-duration="13" data-track-index="2" data-volume="0.6" data-fade-out="0.4"></audio>
      <audio id="engine" class="clip" src="assets/audio/engine.mp3" data-start="0" data-duration="13" data-track-index="3" data-volume="0.9" data-fade-out="0.6"></audio>
      <audio id="sfx-whip" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="2.18" data-duration="0.57" data-track-index="4" data-volume="0.5"></audio>
      <audio id="sfx-cut" class="clip" src="assets/sfx/whoosh.mp3" data-start="4.43" data-duration="0.57" data-track-index="4" data-volume="0.45"></audio>
      <audio id="sfx-reveal" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="4.81" data-duration="2.59" data-track-index="5" data-volume="0.55"></audio>
      <audio id="sfx-sweep" class="clip" src="assets/sfx/sparkle.mp3" data-start="8.4" data-duration="1.2" data-track-index="4" data-volume="0.3" data-fade-out="0.3"></audio>
      <audio id="sfx-brand" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="9.6" data-duration="2.12" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/pop.mp3" data-start="10.47" data-duration="0.72" data-track-index="5" data-volume="0.35"></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
