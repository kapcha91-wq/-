  <script>
    // Camera: transform-origin 0 0, so x/y are the image's top-left offset at the given scale.
    const tl = gsap.timeline({ paused: true });
    const cam = "#plate-cam";
    // Shot 1, headlights: slow pull back while the hook lands.
    tl.fromTo(cam, { scale: 2.4, x: -1512, y: -1238 }, { scale: 2.25, x: -1350, y: -1101, duration: 2.2, ease: "power1.out" }, 0);
